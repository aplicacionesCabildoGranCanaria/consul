include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  # - component: $CI_SERVER_FQDN/components/secret-detection/secret-detection@2.1.0
  - template: Jobs/SAST.gitlab-ci.yml
  # - component: $CI_SERVER_FQDN/components/sast/sast@3.1.
  - template: Jobs/Code-Quality.gitlab-ci.yml
  # - component: $CI_SERVER_FQDN/components/code-quality-oss/codequality-os-scanners-integration/hadolint@1.1.5
  # - component: $CI_SERVER_FQDN/components/code-quality-oss/codequality-os-scanners-integration/phpstan@1.1.5

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        BUILD_TAG: $CI_COMMIT_SHORT_SHA
    - if: $CI_COMMIT_BRANCH == "develop"
      variables:
        BUILD_TAG: $CI_COMMIT_SHORT_SHA
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
      variables:
        BUILD_TAG: $CI_COMMIT_TAG

variables:
  DEPLOY_REPO: https://${CD_DEPLOY_USER}:${CD_DEPLOY_TOKEN}@gitlab.nublo.grancanaria.com/k8s/apps/deployments/${CI_PROJECT_NAME}/${CI_PROJECT_NAME}
  DOCKER_VERSION: 24
  DOCKER_TLS_CERTDIR: ""

stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: docker:$DOCKER_VERSION-cli
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: 2375
      command:  ["--tls=false"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker pull ${CI_REGISTRY_IMAGE}:latest || true
    - DOCKER_BUILDKIT=1 docker build .
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from ${CI_REGISTRY_IMAGE}:latest
      --tag ${CI_REGISTRY_IMAGE}:${BUILD_TAG}
      --tag ${CI_REGISTRY_IMAGE}:latest
    - docker push ${CI_REGISTRY_IMAGE}:${BUILD_TAG}
    - docker push ${CI_REGISTRY_IMAGE}:latest

test:
  stage: test
  image:
    name: $CI_REGISTRY_IMAGE:$BUILD_TAG
    entrypoint: [""]
  parallel: 10
  services:
    - name: postgres:14-alpine
      alias: postgres
  variables:
    DB_HOST: postgres
    PGUSER: postgres
    PGPASSWORD: supersecretpassword_ci
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: supersecretpassword_ci
    RAILS_ENV: test
    DISABLE_SPRING: "true"
    SECRET_KEY_BASE: "un_secret_key_base_aleatorio_y_largo_para_evitar_problemas_de_escritura_en_gitlab_ci"
  before_script:
    - ln -s /var/www/consul/node_modules ./node_modules
    - for i in config/*.example; do cp "$i" "${i/.example}"; done
    - mkdir -p tmp/cache tmp/pids
    - chmod -R 777 tmp/
    
    - PGPASSWORD=supersecretpassword_ci psql -h postgres -U postgres -c "CREATE DATABASE consul_test;" || true
    - PGPASSWORD=supersecretpassword_ci psql -h postgres -U postgres -d consul_test -c "CREATE SCHEMA IF NOT EXISTS shared_extensions; CREATE EXTENSION IF NOT EXISTS unaccent SCHEMA shared_extensions; CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA shared_extensions;"
    
    - bundle exec rails db:setup
    
    - bundle exec rails assets:precompile > /dev/null 2>&1
  script:
    - SPEC_FILES=$(ruby -e "specs = Dir['spec/**/*_spec.rb'].sort; total = ENV['CI_NODE_TOTAL'].to_i; index = ENV['CI_NODE_INDEX'].to_i - 1; size = (specs.size.to_f / total).ceil; puts specs.each_slice(size).to_a[index]&.join(' ')")
    - echo "Ejecutando lote balanceado del nodo $CI_NODE_INDEX de $CI_NODE_TOTAL"
    - bundle exec rspec $SPEC_FILES --format progress
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - tmp/screenshots/

deploy:
  stage: deploy
  image: bitnami/git
  script:
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global http.sslVerify false
    - git clone ${DEPLOY_REPO}
    - cd ${DEPLOY_REPO##*/}/${CI_COMMIT_BRANCH}
    - sed -i "s@image\:\ ${CI_REGISTRY_IMAGE}.*@image\:\ ${CI_REGISTRY_IMAGE}:${BUILD_TAG}@" deployment.yaml
    - git commit -am "deploy:$BUILD_TAG"
    - git push
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never